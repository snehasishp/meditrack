spring:
  application:
    name: meditrack
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/meditrack_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:true}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  paths-to-match: /api/v1/**
  groups:
    enabled: true
  group-configs:
    - group: specialty
      paths-to-match: /api/v1/specialties/**
      packages-to-scan: com.bharath.meditrack.controller.SpecialtyController
    - group: doctor
      paths-to-match: /api/v1/doctors/**
      packages-to-scan: com.bharath.meditrack.controller.DoctorController
    - group: patient
      paths-to-match: /api/v1/patients/**
      packages-to-scan: com.bharath.meditrack.controller.PatientController
    - group: appointment
      paths-to-match: /api/v1/appointments/**
      packages-to-scan: com.bharath.meditrack.controller.AppointmentController
